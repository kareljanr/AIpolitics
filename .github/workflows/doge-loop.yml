# One DOGE research tick on GitHub, so the loop keeps going when the PC is off.
# Secret: GROK_AUTH_JSON = full ~/.grok/auth.json (same Grok Build login as the portfolio runner).
# Does not check out docs/doge/data/raw (about 3.8 GB of stored PDFs).

name: DOGE loop

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doge-loop
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GROK_AUTH_JSON: ${{ secrets.GROK_AUTH_JSON }}
    steps:
      - name: Secrets present
        id: gate
        run: |
          set -euo pipefail
          if [[ -z "${GROK_AUTH_JSON:-}" ]]; then
            if [[ "${GITHUB_EVENT_NAME:-}" == "schedule" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "GROK_AUTH_JSON is not set. Scheduled tick skipped."
              exit 0
            fi
            echo "Set the GROK_AUTH_JSON Actions secret." >&2
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/doge/data/raw/

      - name: Cache Grok CLI
        if: steps.gate.outputs.skip != 'true'
        id: grok-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.grok/bin
            ~/.grok/downloads
          key: grok-cli-linux-v1

      - name: Install Grok CLI
        if: steps.gate.outputs.skip != 'true' && steps.grok-cli.outputs.cache-hit != 'true'
        run: curl -fsSL https://x.ai/cli/install.sh | bash

      - name: Put grok on PATH
        if: steps.gate.outputs.skip != 'true'
        run: echo "$HOME/.grok/bin" >> "$GITHUB_PATH"

      - name: Tick
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/cloud-doge-tick.sh
