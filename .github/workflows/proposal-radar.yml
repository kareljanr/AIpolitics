# Daily Proposal Radar. Grok scores one open proposal, then Telegram posts new ratings.
# Secrets (repo → Settings → Secrets → Actions):
#   GROK_AUTH_JSON           Grok Build login
#   TELEGRAM_BOT_TOKEN       same bot as the portfolio runner
#   RADAR_TELEGRAM_CHAT_ID   DOGE Radar group
#   RADAR_TELEGRAM_THREAD_ID optional topic id

name: Proposal Radar

on:
  schedule:
    # 06:30 UTC ≈ 08:30 Amsterdam in summer, 07:30 in winter.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proposal-radar
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GROK_AUTH_JSON: ${{ secrets.GROK_AUTH_JSON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.RADAR_TELEGRAM_CHAT_ID }}
      TELEGRAM_THREAD_ID: ${{ secrets.RADAR_TELEGRAM_THREAD_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/doge/data/raw/

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install feedparser requests

      - name: Cache Grok CLI
        id: grok-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.grok/bin
            ~/.grok/downloads
          key: grok-cli-linux-v1

      - name: Install Grok CLI
        if: steps.grok-cli.outputs.cache-hit != 'true'
        run: curl -fsSL https://x.ai/cli/install.sh | bash

      - name: Put grok on PATH
        run: echo "$HOME/.grok/bin" >> "$GITHUB_PATH"

      - name: Restore Grok login
        uses: actions/cache@v4
        with:
          path: ~/.grok/auth.json
          key: grok-auth-${{ github.run_id }}
          restore-keys: |
            grok-auth-

      - name: Harvest and refresh the new-ratings note
        run: python docs/proposal-radar/scripts/run_pipeline.py

      - name: Rate one open proposal
        continue-on-error: true
        run: bash scripts/cloud-radar-tick.sh

      - name: Telegram
        run: python docs/proposal-radar/scripts/telegram_notify.py

      - name: Commit new queue rows and the sent ledger
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -- docs/proposal-radar/analyses docs/proposal-radar/data docs/proposal-radar/public docs/proposal-radar/loop_log.md
          if git diff --cached --quiet; then
            echo "No radar files changed."
            exit 0
          fi
          git commit -m "radar: score one proposal and record what was posted."
          git pull --rebase --autostash origin main
          git push origin HEAD
